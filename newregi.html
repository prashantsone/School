<html>

        <style>
   
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 40px;
}

.form-container {
    background-color: #dbdbdb;
    width: 100%;
    max-width:650px;
    margin: 0 auto;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0  4px 8px black;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

label {
    font-size: 14px;
    color: #333;
    margin-bottom: 5px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
}

input {
    height: 30px;
}

textarea {
    resize: vertical;
}

button {
    background-color: #4CAF50;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
}

button:hover {
    background-color: #45a049;
}
#gender{
    height: 30px;
}

</style>
           
    </head>
    <body>
           <div class="form-container">
        <h2>Student Inquiry Form</h2>
        <form action="newregi.jsp" method="POST">
            
            <label >Full Name:</label>
            <input type="text" name="fllnm" required>

            <label >Date Of Birth</label>
            <input type="text" name="dob" required>

            <label >Gender</label>
             <select id="gender" name="gen" required>
            <option value="" disabled selected>Select your gender</option>
            <option value="M">M</option>
            <option value="F">F</option>
            </select>

            <label >Phone Number:</label>
            <input type="text"  name="phone">
            
            <label >Current Address:</label>
            <input type="text"  name="cadd">
                        
            <label >Permanant Address:</label>
            <input type="text"  name="padd">
            
            <label >Nationality:</label>
            <input type="text"  name="nation">
            
            <label >Category:</label>
            <input type="text"  name="catgry">
            
            <label >Religon:</label>
            <input type="text" name="religion">
            
            <label >Caste</label>
            <input type="text" name="cast">
           
            
             <h2>Previous student Academy</h2>
            
            <label >Previous Standerd:</label>
            <input type="text" name="pstand">
             
            <label >Persentage:</label>
            <input type="text" name="per">
             
            <label >Previous School Name</label>
            <input type="text" name="psnm">
            
            <label >Previous Scholl Address</label>
            <input type="text" name="psadd">
            
             <h2>Inquiry For Academy</h2>
             
            <label >New Standerd:</label>
            <input type="text" name="newstd">
             
            <label>Branch</label>
            <input type="text" name="branch">
            
            <label>Division</label>
            <select id="gender" name="div"  required>
            <option value="" disabled selected>Select Your Division</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
            </select>
            
            <label >Medium</label>
            <input type="text" name="medium">
            
            <label >Username</label>
            <input type="text" name="unm">
            
            <label >Password</label>
            <input type="text" name="pass">
            
            <lable>Inquary Date</label>
            <input type="text" name="dt">
            
            
            <button type="submit">Submit Inquiry</button>
        </form>
    </div>
    </body>
